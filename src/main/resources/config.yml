#############################################################
#*---------------------------------------------------------*#
#|                        TrollPlus                        |#
#*---------------------------------------------------------*#
#############################################################

# This is the configuration file for TrollPlus.
# This config was generated for version ${project.version}.

# Always create or update your configuration when you update the plugin!

# For support or questions, please reach out on GitHub, SpigotMC or CurseForge.

# Configuration Version
version: 1.4.8

###################### Global Settings ######################

# Language setting for the plugin. Options are: custom, de, en, es, fr, nl zh-cn, zh-tw. [Default: en]
language: en

# Enable or disable plugin metrics collection. [Default: true]
metrics-enabled: true

# Enable or disable the update checker. [Default: true]
check-for-updates: true

# Sets the plugin's log level. Available options include: DEBUG, INFO, WARNING, and ERROR. [Default: INFO]
log-level: INFO

##################### Feature Settings ######################

# Deactivate active troll features when the target leaves the server. [Default: true]
deactivate-features-on-quit: true

# Allow setting fire for "TNT track" and "Trollbows" features. [Default: false]
set-fire: false

# Allow explosions to destroy blocks for "TNT track" and "Trollbows" features. [Default: false]
break-blocks: false

# List of WorldGuard regions where troll features are disabled for targets. [Default: []]
region-blacklist: []

###################### Troll Settings #######################

# Vanish Feature
# Enable or disable the vanish feature. [Default: true]
vanish:
  enabled: true
  # Enable or disable join and quit messages when a player goes vanish. [Default: false]
  join-message-enabled: false
  quit-message-enabled: false

# Freeze Feature
# Enable or disable the freeze feature. [Default: true]
freeze:
  enabled: true

# Hand Item Drop Feature
# Enable or disable the hand item drop feature. [Default: true]
hand-item-drop:
  enabled: true
# Period in ticks between dropping the hand item. [Default: 20]
hand-item-drop-period: 20

# Control Feature
# Enable or disable the control feature. [Default: true]
control:
  enabled: true
# Enable or disable teleporting the player back to the starting position. [Default: true]
control-teleport-back: true
# Period in ticks between the synchronization of the state between the controller and the target player. [Default: 1]
control-period: 1

# Flip Backwards Feature
# Enable or disable the flip backwards feature. [Default: true]
flip-backwards:
  enabled: true

# Spank Feature
# Enable or disable the spank feature. [Default: true]
spank:
  enabled: true
# Period in ticks between each spanking action. [Default: 120]
spank-period: 120

# Spam Messages Feature
# Enable or disable the spam messages feature. [Default: true]
spam-messages:
  enabled: true
# Period in ticks between spam messages to the player. [Default: 20]
spam-messages-period: 20

# Spam Sounds Feature
# Enable or disable the spam sounds feature. [Default: true]
spam-sounds:
  enabled: true
# Period in ticks between spam sounds to the player. [Default: 10]
spam-sounds-period: 10

# Semi Ban Feature
# Enable or disable the semi ban feature. [Default: true]
semi-ban:
  enabled: true
# Format for the player name in the "Semi ban" messages. [Default: "<[player]>"]
semi-ban-message-replace: "<[player]>" # The "[player]" tag will be replaced with the player's name.

# Falling Anvils Feature
# Enable or disable the falling anvils feature. [Default: true]
falling-anvils:
  enabled: true
# Period in ticks between each falling anvil. [Default: 20]
falling-anvils-period: 20
# Delay in ticks before a falling anvil block is removed after landing. [Default: 100]
falling-anvils-remove-delay: 100

# TNT Track Feature
# Enable or disable the TNT track feature. [Default: true]
tnt-track:
  enabled: true
# Period in ticks between each TNT event. [Default: 20]
tnt-track-period: 20

# Mob Spawner Feature
# Enable or disable the mob spawner feature. [Default: true]
mob-spawner:
  enabled: true
# Period in ticks between each mob spawn. [Default: 60]
mob-spawner-period: 60

# Slowly Kill Feature
# Enable or disable the slowly kill feature. [Default: true]
slowly-kill:
  enabled: true
# Period in ticks between each damage event for the "Slowly Kill" feature. [Default: 60]
slowly-kill-period: 60

# Random Teleport Feature
# Enable or disable the random teleport feature. [Default: true]
random-teleport:
  enabled: true
# Period in ticks between each random teleport for the "Random Teleport" feature. [Default: 160]
random-teleport-period: 160

# Teleport Feature
# Enable or disable the teleport feature. [Default: true]
teleport:
  enabled: true

# Inventory Drop Feature
# Enable or disable the inventory drop feature. [Default: true]
inventory-drop:
  enabled: true

# Inventory Shuffle Feature
# Enable or disable the inventory shuffle feature. [Default: true]
inventory-shuffle:
  enabled: true

# Random Scary Sound Feature
# Enable or disable the random scary sound feature. [Default: true]
random-scary-sound:
  enabled: true
# Volume of the random scary sound. [Default: 50]
random-scary-sound-volume: 200

# Rocket Feature
rocket:
  # Enable or disable the rocket feature. [Default: true]
  enabled: true
  # Number of charges determining how many times the target will be launched. [Default: 20]
  charges: 20
  # Period in ticks between each rocket charge. [Default: 5]
  period: 5

# Fake Ban Feature
# Enable or disable the fake ban feature. [Default: true]
fake-ban:
  enabled: true
# Enable or disable broadcasting a message when a fake ban occurs. [Default: true]
fake-ban-message-broadcast-enabled: true

# Fake OP Feature
# Enable or disable the fake op feature. [Default: true]
fake-op:
  enabled: true
# Enable or disable broadcasting a message when a fake op occurs. [Default: true]
fake-op-message-broadcast-enabled: true

# Random Troll Feature
# Enable or disable the random troll feature. [Default: true]
random-troll:
  enabled: true

# Freefall Feature
# Enable or disable the freefall feature. [Default: true]
freefall:
  enabled: true
# Height to which the target is teleported for the freefall feature. [Default: 100]
freefall-height: 100

# Invsee Feature
# Enable or disable the invsee feature. [Default: true]
invsee:
  enabled: true

# Invsee Ender Chest Feature
# Enable or disable the invsee ender chest feature. [Default: true]
invsee-ender-chest:
  enabled: true

# Kill Feature
# Enable or disable the kill feature. [Default: true]
kill:
  enabled: true

# Trollbows Features
trollbows:
  explosion-bow:
    enabled: true
  tnt-bow:
    enabled: true
  lightning-bolt-bow:
    enabled: true
  silverfish-bow:
    enabled: true
  potion-effect-bow:
    enabled: true
